# Configuração da Fase 2 (depuração mecânica de cada bloco). Tempos em segundos.
# O blocos_finais.json a processar é sempre passado na linha de comando, não aqui.

whisper:
  # Roda por bloco (poucos, já filtrados pela Fase 1), não no vídeo inteiro —
  # precisamos de timestamp por palavra, que SRT não tem, para cortar com
  # segurança (recomeço de frase e a abertura).
  modelo: small
  idioma: Portuguese

silencio:
  noise_db: -30         # abaixo disso (dB) conta como silêncio
  duracao_minima: 0.30  # pausa mais curta que isso nem entra na lista
  limiar_corte: 0.80    # pausa mais longa que isso é encolhida
  duracao_alvo: 0.25    # para quanto encolher uma pausa longa
  margem_seguranca: 0.06  # nunca corta mais perto da palavra do que isso

bordas:
  max_silencio_borda: 0.30  # sobra no máximo isso de silêncio no início/fim do clipe

recomeco:
  ativo: true
  min_palavras: 2       # só corta repetição de 2+ palavras seguidas (conservador:
                         # evita confundir com ênfase retórica intencional)
  max_palavras: 8        # não procura prefixos repetidos maiores que isso
  gap_minimo: 0.12       # pausa mínima entre a tentativa abortada e o recomeço —
                          # sem isso, "um idiota, ele é um idiota" (dito de corrida,
                          # ênfase retórica) é confundido com hesitação genuína
  gap_maximo: 0.5        # pausa máxima entre a tentativa abortada e o recomeço

loudness:
  alvo_lufs: -14
  true_peak: -1.5
  faixa_lra: 11

# Único trecho desta fase que usa IA: escolhe, entre micro-trechos do próprio
# bloco, o que mais impacta sozinho para tocar no início do clipe, antes do
# corte principal — mostra o pico primeiro para prender atenção. Usa a mesma
# chave do OpenRouter da Fase 1 (fase1/.env). Sem chave, ou com ativo: false,
# o pipeline segue normalmente e só não gera a abertura.
abertura:
  ativo: true
  duracao_minima: 1.8
  duracao_maxima: 7.0
  max_candidatos: 20   # teto de opções mandadas ao JEV (mais opções = decisão pior/mais lenta)
  margem_inicio: 5.0   # regra dura: nenhum candidato pode começar antes disso (segundos, desde
                        # o início do bloco) — senão a abertura pode coincidir com o próprio
                        # começo do corte principal, mostrando a mesma fala duas vezes
  escala_de_cinza: true  # a abertura sai em P&B — diferencia visualmente do corte principal,
                          # que continua colorido

jev:
  modelo: "~typesafe/jev-latest"
  timeout: 30
  tentativas: 3

# Transição entre a abertura e o corte principal. Dois efeitos independentes:
# - Som (ativo: false desliga só este): um efeito (sorteado da pasta, um por
#   bloco) toca sobre o final da abertura desacelerado — o slow motion estica
#   o vídeo até caber exatamente o tempo do som, cobrindo a junção sem deixar
#   buraco (as pausas longas foram cortadas, não sobra vídeo "neutro" para
#   esconder um corte seco).
# - Fade visual (duracao_fade/tipo_fade — sempre ativo, independente do som):
#   crossfade de vídeo+áudio entre abertura e corte principal, em vez do
#   corte seco que a versão anterior usava (concat direto).
# Os dois só entram se a abertura tiver sido gerada.
transicao:
  ativo: true
  pasta_sons: "C:\\Users\\joaor\\Videos\\CortaLegenda\\transition"
  fator_slow: 2.0            # quanto mais devagar fica o trecho final da abertura
                              # (limite técnico: até 2x nesta implementação, por causa
                              # do filtro atempo do FFmpeg — ver transicao.py)
  volume_whoosh: 1.3         # ganho do efeito sonoro
  volume_voz_no_slow: 0.25   # o quanto abafar a voz original enquanto o efeito toca
  duracao_fade: 0.35         # segundos de crossfade entre a abertura e o corte principal
  tipo_fade: "fade"          # qualquer transição do filtro xfade do FFmpeg
                              # ("fade" = dissolve clássico; outras: fadeblack, wipeleft,
                              # slideup, circlecrop, distance...)

crop:
  # Crop dinâmico 9:16 (segue quem fala) no bloco inteiro, ANTES do corte e da
  # abertura — a abertura herda o enquadramento feito com o contexto todo.
  # Precisa de mediapipe/opencv/resemblyzer (requirements_crop.txt); sem eles,
  # deixe false e o bloco sai em 16:9.
  ativo: true
  config: "config_crop.yaml"   # relativo a esta pasta (fase1)

saida:
  pasta: "cortes"
  crossfade_ms: 15   # suaviza o ponto de corte de áudio (evita "clique")
