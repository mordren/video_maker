falante_ativo:
  # Quem fala visto pela boca + voz (LR-ASD, fase1/falante_ativo.py), na GPU.
  # Precisa de torchcodec, torchvision, onnx2torch, python_speech_features e
  # dos pesos em fase1/models (det_10g.onnx, lrasd_finetuning_TalkSet.model).
  # false (ou se falhar) = crop antigo abaixo (MediaPipe + voz, falantes.py).
  ativo: true

deteccao:
  passo_seg: 0.1          # rosto/boca a cada 0.1s (boca precisa de resolução p/ ver quem fala)
  confianca_minima: 0.75   # YuNet; abaixo disso aparecem rostos falsos (quadro na parede etc.)
  max_rostos: 4
  limiar_corte: 10.0      # scdet do FFmpeg: sensibilidade para achar troca de câmera

camera:
  zona_morta: 0.10        # rosto pode andar até 10% da largura do frame sem a câmera mexer
  tempo_fora: 0.8         # s fora da zona morta antes de re-enquadrar
  tempo_pan: 0.5          # s de duração do re-enquadramento
  segura_minimo: 2.0      # s mínimos parada entre dois movimentos
  turno_minimo: 1.5       # turno de fala mais curto que isso não troca de pessoa

falantes:
  ativo: true
  whisper_modelo: small
  idioma: pt
  n_falantes: null        # null = descobre sozinho; ou fixe (ex.: 2)
  limiar: 0.35            # distância de cosseno p/ separar vozes quando n_falantes é null

saida:
  largura: 1080
  altura: 1920
  pasta: "crop_vertical"
